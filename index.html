<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grand Fork</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">The Grand <span>Fork</span></div>

  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>Luxury Dining Experience</h1>
</section>

<main id="menu"></main>

<!-- CART DRAWER -->
<div id="cart" class="cart">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button onclick="toggleCart()">✖</button>
  </div>

  <div id="cartItems"></div>

  <div class="cart-footer">
    <h3 id="total">Total: Rs 0</h3>
    <button class="checkout-btn" onclick="checkout()">Checkout on WhatsApp</button>
  </div>
</div>

<div id="overlay" onclick="toggleCart()"></div>

<script src="script.js"></script>
</body>
</html>
