<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grand Fork</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
  <div class="logo">The Grand <span>Fork</span></div>

  <button class="cart-btn" onclick="toggleCart()">
    🛒 Cart <span id="cartCount">0</span>
  </button>
</header>

<section class="hero">
  <h1>Luxury Dining <em>Experience</em></h1>
  <p>Premium burgers, pizza, pasta, drinks, coffee & desserts.</p>
</section>

<main id="menu"></main>

<!-- CART -->
<div id="cart" class="cart">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3 id="total">Total: Rs 0</h3>
</div>

<script src="script.js"></script>
</body>
</html>
